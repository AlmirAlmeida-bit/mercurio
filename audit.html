<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; img-src 'self'; style-src 'unsafe-inline'">
<title>Auditoria</title>
<style>
  :root { --bg: #0f1013; --raised: #1b1c21; --hover: #ffffff0b; --line: #26282e; --fg: #e8e9ec; --dim: #80838d; --ok: #5fbf8f; --warn: #e07a6a; --nav: #8fb3ff; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f3f4f6; --raised: #ffffff; --hover: #0000000a; --line: #d9dce1; --fg: #1a1b1f; --dim: #6b6f78; --ok: #1f8a57; --warn: #b8473a; --nav: #2f5fd0; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; padding: 32px 40px 64px; }
  :focus-visible { outline: 2px solid #9aa0ab; outline-offset: 1px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 6px; }
  h1 { margin: 0; font: 300 26px "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  .badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 12px; font-size: 12px; outline: 1px dashed var(--dim); outline-offset: -1px; color: var(--dim); }
  .sub { margin: 0 0 22px; color: var(--dim); }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .stat { padding: 10px 16px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); min-width: 120px; }
  .stat b { display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--dim); font-size: 12px; }
  .tools { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  input { flex: 1; min-width: 200px; height: 38px; padding: 0 16px; border: 1px solid var(--line); border-radius: 19px; background: var(--raised); color: var(--fg); font: inherit; outline: none; }
  button { height: 38px; padding: 0 18px; border: 0; border-radius: 19px; background: none; color: inherit; font: inherit; cursor: pointer; box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; }
  button:hover { background: var(--hover); }
  #end { color: var(--warn); }
  .list { background: var(--raised); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .row { display: grid; grid-template-columns: 70px 92px 56px 52px 96px 1fr; gap: 10px; align-items: center; padding: 7px 14px; border-top: 1px solid var(--line); font-size: 12.5px; }
  .row:first-child { border-top: 0; }
  .row.head { color: var(--dim); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; }
  .row span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .t { color: var(--dim); font-variant-numeric: tabular-nums; }
  .k-nav { color: var(--nav); }
  .s-ok { color: var(--ok); }
  .s-err { color: var(--warn); }
  .empty { padding: 40px; text-align: center; color: var(--dim); }
  .note { margin-top: 14px; color: var(--dim); font-size: 12.5px; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Auditoria</h1>
      <span class="badge">◌ Sessão efêmera</span>
    </header>
    <p class="sub" id="since"></p>
    <div class="stats">
      <div class="stat"><b id="n-nav">0</b><span>navegações</span></div>
      <div class="stat"><b id="n-req">0</b><span>requisições</span></div>
      <div class="stat"><b id="n-err">0</b><span>erros</span></div>
      <div class="stat"><b id="n-host">0</b><span>domínios</span></div>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="Filtrar por endereço, método, tipo…" aria-label="Filtrar eventos">
      <button id="export">Exportar JSON</button>
      <button id="end">Encerrar sessão efêmera</button>
    </div>
    <div class="list" id="list"></div>
    <p class="note">Este registro fica só na memória (até 2.000 eventos) e é descartado, junto com cookies e cache, ao encerrar a sessão efêmera. Exporte antes se quiser guardar.</p>
  </div>
  <script src="audit.js"></script>
</body>
</html>
