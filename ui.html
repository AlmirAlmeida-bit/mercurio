<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'">
<title>Mercurio</title>
<style>
  :root {
    --bg: #0f1013; --raised: #1b1c21; --hover: #ffffff0f; --line: #26282e;
    --fg: #e8e9ec; --dim: #80838d; --off: #44464d;
    --metal: linear-gradient(135deg, #ffffff, #b9bec8 55%, #8a909c);
    --metal-fg: #121317;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #e4e6ea; --raised: #f7f8fa; --hover: #0000000d; --line: #d3d6dc;
      --fg: #1a1b1f; --dim: #6b6f78; --off: #b4b7bd;
      --metal: linear-gradient(135deg, #3a3d45, #1a1b1f); --metal-fg: #f7f8fa;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); user-select: none; overflow: hidden;
         font: 12.5px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  button { display: grid; place-items: center; padding: 0; border: 0; background: none; color: inherit;
           border-radius: 2px; cursor: pointer; font: inherit; -webkit-app-region: no-drag; }
  button:hover:not(:disabled) { background: var(--hover); }
  button:disabled { color: var(--off); cursor: default; }
  :focus-visible { outline: 2px solid var(--accent, #9aa0ab); outline-offset: -2px; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* linha 1: logo + abas (arrastável; o espaço à direita é dos controles da janela) */
  #top { display: flex; align-items: center; gap: 2px; height: 40px; padding: 0 140px 0 10px; -webkit-app-region: drag; }
  #logo { width: 20px; height: 20px; margin: 0 8px 0 2px; flex: none; }
  #tabs { display: flex; gap: 2px; min-width: 0; flex: 0 1 auto; }
  .tab { display: flex; align-items: center; gap: 8px; width: 200px; min-width: 56px; flex: 0 1 200px; height: 30px;
         padding: 0 6px 0 10px; border-radius: 2px; color: var(--dim); -webkit-app-region: no-drag; }
  .tab:hover { background: var(--hover); }
  .tab.on { background: var(--raised); color: var(--fg); box-shadow: 0 0 0 1px var(--line), inset 0 -2px 0 var(--accent, transparent); }
  .tab img, .tab .dot, .tab .spin { width: 14px; height: 14px; flex: none; }
  .tab .dot { border-radius: 2px; background: var(--metal); transform: scale(.55); }
  .tab .spin { border: 1.6px solid var(--off); border-top-color: var(--accent, var(--fg)); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }
  .tab span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tab button { width: 20px; height: 20px; border-radius: 2px; opacity: 0; flex: none; }
  .tab:hover button, .tab.on button { opacity: 1; }
  .tab button svg { width: 12px; height: 12px; }
  #plus { width: 30px; height: 30px; flex: none; color: var(--dim); }

  /* atualização baixada e pronta */
  #update { display: flex; align-items: center; gap: 6px; height: 26px; margin-left: auto; padding: 0 12px; flex: none; border-radius: 2px;
            background: var(--metal); color: var(--metal-fg); font-size: 12px; font-weight: 600; }
  #update[hidden] { display: none; }
  #update svg { width: 13px; height: 13px; }

  /* seletor de contexto: Principal / cápsula / sessão efêmera */
  #ctx { display: flex; align-items: center; gap: 7px; height: 28px; max-width: 170px; padding: 0 10px; margin-right: 6px; flex: none;
         border-radius: 2px; color: var(--dim); font-size: 12px; box-shadow: inset 0 0 0 1px var(--line); }
  #ctx span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #ctx i { width: 8px; height: 8px; border-radius: 2px; background: var(--dim); flex: none; }
  #ctx svg { width: 10px; height: 10px; flex: none; }
  body[data-kind="capsule"] #ctx { color: var(--fg); }
  body[data-kind="capsule"] #ctx i { background: var(--accent, #9aa0ab); }
  body[data-kind="ephemeral"] #ctx { color: var(--fg); box-shadow: none; outline: 1px dashed var(--dim); outline-offset: -1px; }
  body[data-kind="ephemeral"] #ctx i { background: none; border: 1.5px dashed var(--fg); }
  body[data-kind="ephemeral"] .tab.on { box-shadow: none; outline: 1px dashed var(--dim); outline-offset: -1px; }

  /* linha 2: navegação */
  #nav { display: flex; align-items: center; gap: 2px; height: 40px; padding: 0 8px 4px; }
  #nav > button { width: 32px; height: 32px; }
  #bar { flex: 1; display: flex; align-items: center; gap: 8px; height: 32px; margin: 0 6px; padding: 0 14px;
         border-radius: 2px; background: var(--raised); box-shadow: 0 0 0 1px var(--line); transition: box-shadow .15s; }
  #bar:focus-within { box-shadow: 0 0 0 1.5px var(--accent, #9aa0ab); }
  #bar svg { width: 13px; height: 13px; color: var(--dim); flex: none; }
  #insecure { color: #e0a04a; font-size: 11.5px; white-space: nowrap; }
  #url { flex: 1; min-width: 0; height: 100%; border: 0; background: none; color: var(--fg); font: inherit; font-size: 13px; outline: none; }
  #url::placeholder { color: var(--dim); }
  #star { width: 26px; height: 26px; margin-right: -8px; border-radius: 2px; color: var(--dim); flex: none; }
  #star svg { width: 15px; height: 15px; color: inherit; }
  #star[aria-pressed="true"] { color: var(--accent, var(--fg)); }
  #star[aria-pressed="true"] svg { fill: currentColor; }
  #star:disabled { color: var(--off); }

  /* downloads: a seta desce de leve enquanto baixa, com uma linha fina de progresso; ao terminar, um brilho rápido */
  #downloads { position: relative; }
  #downloads .arrow { transform-box: fill-box; }
  #downloads.busy { color: var(--fg); }
  #downloads.busy .arrow { animation: drop 1.4s ease-in-out infinite; }
  @keyframes drop { 0%, 100% { transform: translateY(-1.5px); opacity: 1; } 50% { transform: translateY(1.5px); opacity: .55; } }
  #downloads .prog { position: absolute; left: 8px; right: 8px; bottom: 3px; height: 2px; border-radius: 2px; overflow: hidden;
                     background: var(--line); opacity: 0; transition: opacity .3s; }
  #downloads.busy .prog { opacity: 1; }
  #downloads .prog i { display: block; width: var(--p, 0%); height: 100%; background: var(--accent, var(--fg)); box-shadow: var(--glow, none); transition: width .25s; }
  #downloads.busy.indet .prog i { width: 40%; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  #downloads.done { color: var(--accent, var(--fg)); animation: flash 1.8s ease-out; }
  @keyframes flash { 0% { filter: drop-shadow(0 0 6px var(--accent, transparent)); } 100% { filter: none; } }
  @media (prefers-reduced-motion: reduce) { #downloads, #downloads * { animation: none !important; } }

  /* barra de favoritos */
  #bookmarks { display: flex; align-items: center; gap: 2px; height: 32px; padding: 0 10px 4px; overflow: hidden; }
  #bookmarks[hidden] { display: none; }
  .bm { display: flex; align-items: center; gap: 7px; height: 26px; max-width: 180px; padding: 0 10px; flex: none;
        border-radius: 2px; color: var(--dim); font-size: 12px; }
  .bm:hover { background: var(--hover); color: var(--fg); }
  .bm[hidden] { display: none; }
  .bm img, .bm i { width: 14px; height: 14px; flex: none; }
  .bm i { border-radius: 2px; background: var(--metal); transform: scale(.5); }
  .bm span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #bm-more { width: 26px; height: 26px; margin-left: auto; flex: none; color: var(--dim); }
  #bm-more[hidden] { display: none; }

  /* faixa de permissão */
  #prompt { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px 4px 16px; }
  #prompt[hidden] { display: none; }
  #prompt p { flex: 1; margin: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #prompt b { font-weight: 600; }
  #prompt button { height: 30px; padding: 0 14px; border-radius: 2px; }
  #deny { box-shadow: inset 0 0 0 1px var(--line); }
  #allow { background: var(--metal); color: var(--metal-fg); font-weight: 600; }
  #allow:hover { background: var(--metal); filter: brightness(1.08); }

  /* neon: brilho da cor de destaque */
  .tab.on { box-shadow: 0 0 0 1px var(--line), inset 0 -2px 0 var(--accent, transparent), 0 6px 12px -10px var(--accent, transparent); }
  #update, #allow { box-shadow: var(--glow, none); }
  #star[aria-pressed="true"] svg { filter: drop-shadow(0 0 4px var(--accent, transparent)); }
  #bar:focus-within { box-shadow: 0 0 0 1.5px var(--accent, #9aa0ab), var(--glow, none); }
  body[data-kind="capsule"] #ctx i { box-shadow: var(--glow, none); }
  .tab .spin { border-top-color: var(--accent, var(--fg)); filter: drop-shadow(0 0 3px var(--accent, transparent)); }
</style>
</head>
<body>
  <div id="top">
    <img id="logo" src="assets/logo.png" alt="Mercurio">
    <button id="ctx" title="Contexto: Principal, cápsulas e sessão efêmera" aria-haspopup="menu"><i></i><span>Principal</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <div id="tabs" role="tablist"></div>
    <button id="plus" title="Nova aba (Ctrl+T)" aria-label="Nova aba"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="update" hidden><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span>Atualizar</span></button>
  </div>
  <div id="nav">
    <button id="back" title="Voltar" aria-label="Voltar"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button id="forward" title="Avançar" aria-label="Avançar"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    <button id="reload" title="Recarregar (F5)" aria-label="Recarregar"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    <button id="home" title="Início — trestech.com.br" aria-label="Início"><svg viewBox="0 0 24 24"><path d="M4 11l8-6.5 8 6.5"/><path d="M6 9.5V19h4.5v-5h3v5H18V9.5"/></svg></button>
    <label id="bar">
      <svg id="lock" viewBox="0 0 24 24" aria-label="Conexão segura"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <span id="insecure" hidden>Não seguro</span>
      <input id="url" spellcheck="false" placeholder="Pesquise ou digite um endereço" aria-label="Endereço">
      <button id="star" type="button" title="Favoritar (Ctrl+D)" aria-label="Favoritar esta página" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>
      </button>
    </label>
    <button id="downloads" title="Downloads: abrir a pasta" aria-label="Abrir a pasta de downloads">
      <svg viewBox="0 0 24 24"><g class="arrow"><path d="M12 4v10"/><path d="M8 10.5l4 4 4-4"/></g><path d="M5 19.5h14"/></svg>
      <span class="prog"><i></i></span>
    </button>
    <button id="panel" title="Painel: favoritos, histórico, extensões e preferências" aria-label="Abrir painel">
      <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
    </button>
  </div>
  <div id="bookmarks" role="toolbar" aria-label="Barra de favoritos" hidden>
    <button id="bm-more" title="Mais favoritos" aria-label="Mais favoritos" hidden><svg viewBox="0 0 24 24"><path d="M7 7l5 5-5 5M13 7l5 5-5 5"/></svg></button>
  </div>
  <div id="prompt" role="alertdialog" aria-live="polite" hidden>
    <p><b id="p-origin"></b> quer <span id="p-label"></span></p>
    <button id="deny">Bloquear</button>
    <button id="allow">Permitir</button>
  </div>
  <script src="accent.js"></script>
  <script src="ui.js"></script>
</body>
</html>
