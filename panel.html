<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'">
<title>Painel</title>
<style>
  :root {
    --bg: #0f1013; --side: #131418; --raised: #1b1c21; --hover: #ffffff0b; --line: #26282e;
    --fg: #e8e9ec; --dim: #80838d; --off: #4a4c53; --warn: #e07a6a;
    --metal: linear-gradient(135deg, #ffffff, #b9bec8 55%, #8a909c); --metal-fg: #121317;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f3f4f6; --side: #e9ebee; --raised: #ffffff; --hover: #0000000a; --line: #d9dce1;
      --fg: #1a1b1f; --dim: #6b6f78; --off: #b4b7bd; --warn: #b8473a;
      --metal: linear-gradient(135deg, #3a3d45, #1a1b1f); --metal-fg: #f7f8fa;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; background: var(--bg); color: var(--fg); font: 14px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; border-radius: 8px; }
  :focus-visible { outline: 2px solid var(--accent, #9aa0ab); outline-offset: 1px; }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  nav { width: 232px; flex: none; padding: 28px 14px; background: var(--side); border-right: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 28px; }
  .brand img { width: 26px; height: 26px; }
  .brand span { font: 300 15px "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; letter-spacing: .3em; text-transform: lowercase; color: var(--dim); }
  nav a { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; margin-bottom: 2px; border-radius: 10px; color: var(--dim); }
  nav a:hover { background: var(--hover); color: var(--fg); }
  nav a[aria-current="page"] { background: var(--raised); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }
  nav a[aria-current="page"] svg { color: var(--accent, currentColor); }

  main { flex: 1; overflow-y: auto; padding: 40px 48px 64px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font: 300 28px "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  .sub { margin: 0 0 28px; color: var(--dim); }
  h2 { margin: 36px 0 12px; font-size: 13px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; }
  h2:first-child { margin-top: 0; }

  .tools { display: flex; gap: 10px; margin-bottom: 20px; }
  .search { flex: 1; height: 40px; padding: 0 16px; border: 1px solid var(--line); border-radius: 20px; background: var(--raised); color: var(--fg); font: inherit; outline: none; }
  .search:focus { border-color: var(--accent, #9aa0ab); }
  .btn { height: 40px; padding: 0 18px; border-radius: 20px; box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--metal); color: var(--metal-fg); box-shadow: none; font-weight: 600; }
  .btn.danger { color: var(--warn); }

  .list { background: var(--raised); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 8px 10px 8px 18px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row:hover { background: var(--hover); }
  .row .main { flex: 1; min-width: 0; }
  .row .t { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .row .u { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--dim); font-size: 12.5px; margin-top: 2px; }
  .row time { color: var(--dim); font-size: 12.5px; font-variant-numeric: tabular-nums; width: 42px; flex: none; }
  .row .ico { width: 36px; height: 36px; border-radius: 9px; flex: none; display: grid; place-items: center; background: var(--hover); }
  .row .ico img { width: 28px; height: 28px; }
  .x { width: 32px; height: 32px; display: grid; place-items: center; color: var(--dim); flex: none; }
  .x:hover { background: var(--hover); color: var(--fg); }
  .x svg { width: 15px; height: 15px; }
  .row .act { height: 32px; padding: 0 14px; border-radius: 16px; box-shadow: inset 0 0 0 1px var(--line); color: var(--dim); font-size: 13px; flex: none; }
  .row .act:hover { color: var(--warn); }
  .row .act.go:hover { color: var(--accent, var(--fg)); }
  .row .act:disabled { opacity: .5; cursor: default; }
  .empty { padding: 48px 24px; text-align: center; color: var(--dim); }
  .more { padding: 14px; text-align: center; color: var(--dim); font-size: 13px; }

  .seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 12px; background: var(--side); box-shadow: inset 0 0 0 1px var(--line); }
  .seg button { height: 32px; padding: 0 16px; border-radius: 9px; color: var(--dim); }
  .seg button[aria-pressed="true"] { background: var(--raised); color: var(--fg); box-shadow: 0 1px 2px #0003, 0 0 0 1px var(--line); }
  .setting { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 18px; flex-wrap: wrap; }
  .setting + .setting { border-top: 1px solid var(--line); }
  .setting p { margin: 2px 0 0; color: var(--dim); font-size: 12.5px; }
  .ok { color: var(--dim); }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .sw { position: relative; width: 28px; height: 28px; border-radius: 50%; background: var(--c); cursor: pointer;
        box-shadow: inset 0 0 0 1px #ffffff26; transition: transform .12s; }
  .sw:hover { transform: scale(1.1); }
  .sw[aria-checked="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); }
  .sw.custom { background: var(--c, conic-gradient(#ff5d5d, #ffd23f, #4ade80, #38bdf8, #a78bfa, #ff5d5d)); }
  .sw.custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .about { display: flex; align-items: center; gap: 16px; padding: 18px; }
  .about img { width: 44px; height: 44px; }
  .about a { text-decoration: underline; text-underline-offset: 3px; }
  @media (max-width: 720px) { nav { width: 68px; } nav a span, .brand span { display: none; } main { padding: 28px 18px; } }
</style>
</head>
<body>
  <nav aria-label="Seções do painel">
    <div class="brand"><img src="assets/logo.png" alt=""><span>Mercurio</span></div>
    <a href="#favoritos"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg><span>Favoritos</span></a>
    <a href="#historico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Histórico</span></a>
    <a href="#extensoes"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg><span>Extensões</span></a>
    <a href="#preferencias"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span>Preferências</span></a>
  </nav>
  <main><div class="wrap" id="view"></div></main>
  <script src="accent.js"></script>
  <script src="panel.js"></script>
</body>
</html>
