<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; img-src 'self'; style-src 'unsafe-inline'">
<title>Apoie o Mercurio</title>
<style>
  :root { color-scheme: dark; --bg: #000; --fg: #e8e9ec; --dim: #8a8d96; --line: #26282e; --raised: #0d0e12; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; }
  body { display: grid; place-items: center; padding: 32px 16px; background: radial-gradient(ellipse at 50% 35%, #0d0e12, var(--bg) 70%);
         color: var(--fg); font: 15px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  main { width: min(760px, 100%); display: grid; grid-template-columns: 1fr auto; gap: 40px; align-items: center; }
  .logo { width: 56px; height: 56px; }
  h1 { margin: 12px 0 10px; font: 300 30px "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  p { margin: 0 0 14px; color: var(--dim); line-height: 1.55; }
  .qr { padding: 14px; background: #fff; border-radius: 2px; box-shadow: var(--glow, 0 0 18px rgba(57, 255, 20, .35)); }
  .qr img { display: block; width: 232px; height: 232px; image-rendering: pixelated; }
  .para { margin-top: 10px; text-align: center; color: var(--dim); font-size: 12.5px; }
  .copia { display: flex; gap: 6px; margin: 18px 0 6px; }
  .copia input { flex: 1; min-width: 0; height: 38px; padding: 0 10px; border: 1px solid var(--line); border-radius: 2px;
                 background: var(--raised); color: var(--dim); font: 12px Consolas, monospace; }
  button { height: 38px; padding: 0 16px; border: 0; border-radius: 2px; background: var(--metal, #39ff14); color: var(--metal-fg, #000);
           font: inherit; font-weight: 600; cursor: pointer; box-shadow: var(--glow, none); white-space: nowrap; }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  small { color: var(--dim); }
  @media (max-width: 640px) { main { grid-template-columns: 1fr; justify-items: center; text-align: center; } }
</style>
</head>
<body>
  <main>
    <section>
      <img class="logo" src="assets/logo.png" alt="">
      <h1>Apoie o Mercurio</h1>
      <p>O Mercurio é gratuito e feito no Brasil pela TresTech. Se ele é útil para você, qualquer valor ajuda a mantê-lo rápido, seguro e atualizado.</p>
      <p>Abra o app do seu banco, escolha <b>Pix → Ler QR code</b> e aponte para o código. Ou copie o Pix copia e cola:</p>
      <div class="copia">
        <input id="codigo" readonly aria-label="Pix copia e cola">
        <button id="copiar" type="button">Copiar</button>
      </div>
      <small id="recebedor"></small>
    </section>
    <figure style="margin:0">
      <div class="qr"><img src="assets/pix.png" alt="QR code do Pix para doação"></div>
      <figcaption class="para">Você escolhe o valor no app do banco</figcaption>
    </figure>
  </main>
  <script src="accent.js"></script>
  <script src="pix-dados.js"></script>
  <script src="apoiar.js"></script>
</body>
</html>
